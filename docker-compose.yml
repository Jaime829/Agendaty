services:
  # --------------------------------------------------------------------------
  # Backend Spring Boot con H2 en memoria (perfil de desarrollo)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agendaty-backend
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@turnos.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123*}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------------------------
  # Frontend React servido por nginx
  # VITE_API_URL se fija en el build de Vite, no en tiempo de ejecución
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_USE_MOCK: "false"
    container_name: agendaty-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
